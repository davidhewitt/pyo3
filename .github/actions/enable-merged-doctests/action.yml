name: Enable merged doctests
description: Temporarily use Rust 2024 edition to enable merged doctests
runs:
  using: composite
  steps:
    - name: Set Rust edition to 2024 and MSRV to 1.85
      shell: bash
      run: |
        if ! grep -qx 'edition = "2021"' Cargo.toml; then
          echo 'expected Cargo.toml to use Rust 2021 edition' >&2
          exit 1
        fi
        if ! grep -qx 'package.rust-version = "1.83"' Cargo.toml; then
          echo 'expected Cargo.toml to require Rust 1.83' >&2
          exit 1
        fi
        sed -i \
          -e 's/^edition = "2021"$/edition = "2024"/' \
          -e 's/^package.rust-version = "1.83"$/package.rust-version = "1.85"/' \
          Cargo.toml
